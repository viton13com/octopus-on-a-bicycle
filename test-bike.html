<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { buildBike } from './js/bike.js';
import { buildOctopus } from './js/octopus.js';
const W = innerWidth, H = innerHeight;
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(W, H); r.setPixelRatio(1); r.toneMapping = THREE.ACESFilmicToneMapping; r.shadowMap.enabled = true; document.body.appendChild(r.domElement);

const sun = new THREE.DirectionalLight('#fff', 2.5); sun.position.set(2, 4, 3); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); s.add(sun);

window.view = (px, py, pz, tx, ty, tz, fov = 30, crank = 0.6, steer = 0) => { cam.fov = fov; cam.updateProjectionMatrix(); cam.position.set(px, py, pz); cam.lookAt(tx, ty, tz);

  octo.update(Object.assign({ t: 1.3, speed: 5, cupPos: new THREE.Vector3(0.48, 1.12, 0.3), look: cam.position.clone() }, window.OS || {}));
  r.render(s, cam); };
